<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border with Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- border-8 is for border weight border thickness -->
    <div class="border m-10 w-96 p-4">Tailwind CSS</div>
    <div class="m-10 w-96 p-4 border-8">Tailwind CSS</div>
    <div class="m-10 w-96 p-4 border-8 border-indigo-500">Tailwind CSS</div>
    <div class="m-10 w-96 p-4 border-8 border-b-indigo-500">Tailwind CSS</div>
    <div class="m-10 w-96 p-4 border-8 border-t-indigo-500">Tailwind CSS</div>
    <div class="m-10 w-96 p-4 border-8 border-l-indigo-500">Tailwind CSS</div>
    <div class="m-10 w-96 p-4 border-8 border-r-indigo-500">Tailwind CSS</div>
    <div class="m-10 w-96 p-4 border-8 border-r-indigo-500">Tailwind CSS</div>
    <div
      class="m-10 w-96 p-4 border-8 border-r-indigo-500 border-b-red-500 border-l-emerald-500"
    >
      Tailwind CSS
    </div>
    <div class="m-10 w-96 p-4 border-8 border-r-indigo-500">Tailwind CSS</div>

    <div class="size-32 m-10 p-4 border-4 border-indigo-500 rounded-full">
      Tailwind CSS box
    </div>

    <div class="size-32 m-10 p-4 border-4 border-indigo-500 rounded-t-full">
      Tailwind CSS box
    </div>

    <div class="size-32 m-10 p-4 border-4 border-indigo-500 rounded-l-full">
      Tailwind CSS box
    </div>

    <div class="size-32 m-10 p-4 border-4 border-indigo-500 rounded-r-full">
      Tailwind CSS box
    </div>

    <div class="size-32 m-10 p-4 border-4 border-indigo-500 rounded-3xl">
      Tailwind CSS box
    </div>

    <!-- round from one corner -->
    <div class="size-32 m-10 p-4 border-4 border-indigo-500 rounded-ss-3xl">
      Tailwind CSS box
    </div>

    <div class="size-32 m-10 p-4 border-4 border-indigo-500 rounded-es-3xl">
      Tailwind CSS box
    </div>

    <div class="size-32 m-10 p-4 border-4 border-indigo-500 rounded-ss-3xl border-dotted">
      Tailwind CSS box
    </div>
  </body>
</html>
