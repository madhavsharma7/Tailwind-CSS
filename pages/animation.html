<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <img>
<!-- Bounce Animation-->
    <div class="size-10 bg-red-600 m-3 rounded-full animate-bounce"></div>
    <hr />
<!-- Spin Animation -->
    <div class="w-10 h-1 bg-red-500 mt-8 ml-10  animate-spin " ></div>
    <hr />
<!-- Image Spin Animation -->
    <img src="spin.png" class="w-[8vw] mt-5 animate-spin" />
    <hr/>
<!-- Ping Animation -->
    <div class="size-5 bg-red-600 m-3 ml-[3.6vw] rounded-full animate-ping"></div>
    <hr />
<!-- Pulse Animation -->
    <div class="size-5 bg-red-600 m-3 ml-[3.6vw] rounded-full animate-pulse"></div>
     <hr/>

  </body>
</html>
