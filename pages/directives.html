<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directives</title>
    <link rel="stylesheet" href="./Css/output.css" />
  </head>
  <body>
    <!-- In Tailwind CSS, Utilities  -->
    <!--In Tailwind CSS, directives are special CSS at-rules that tell Tailwind what CSS to generate that how to behave. They start with @  -->
    <!-- In core css it is called At-Rules -->
    <!-- In Tailwind CSS it is called Directives -->

    <!-- base → Browser reset (Preflight) and default styles.
         components → Reusable component classes.
         utilities → All Tailwind utility classes (bg-blue-500, flex, p-4, etc.). -->

    <!-- Read more deeply -->
    <!-- Lets take an example -->

    <h1>Hello World</h1>

    <!-- comment outing the css file to see difference b/w directives and non directives -->

    <!-- Tailwind Css Base  -->
    <!-- Base makes it default when we open browser like h1 takes same size which we have given and we can change it-->

    <h1>Hello World Tailwind CSS Base</h1>
    <h1>Hello World Tailwind CSS Base 2</h1>

    <!-- it is normal because we didnt given the size as base  -->

    <!-- <h2>Hello World</h2> -->
    <!-- Default size given all button are of same size as defualt just because of base  -->
    <button>Login</button>
    <button>Login</button> <button>Login</button>

    <!-- we did it through css properties now we are using Tailwind CSS as default-->
    <h1>Hello World Tailwind CSS Base</h1>
    
  </body>
</html>
