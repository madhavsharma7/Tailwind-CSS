<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Classes</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- Blur -->
    <img src="monkey.jpg" />

    <div
      class="size-96 ml-20 bg-[url('monkey.jpg')] bg-cover bg-center blur-sm"
    ></div>

    <div class="size-96 ml-20 bg-[url('monkey.jpg')] bg-center blur-md"></div>

    <div class="size-96 ml-20 bg-[url('monkey.jpg')] bg-center blur-none"></div>

    <div class="size-96 ml-20 bg-[url('monkey.jpg')] bg-center blur-2xl"></div>

    <h1 class="m-20 text-4xl blur-sm">Code day by day</h1>

    <!-- Brightness -->

    <h1 class="m-20 text-2xl">Brightness</h1>
    <img class="m-20" src="monkey.jpg" />
    <img class="m-20 brightness-50" src="monkey.jpg" />
    <img class="m-20 brightness-95" src="monkey.jpg" />
    <img class="m-20 brightness-125" src="monkey.jpg" />
    <img class="m-20 brightness-150" src="monkey.jpg" />
    <img class="m-20 brightness-200" src="monkey.jpg" />

    <!-- Contrast -->
    <h1 class="m-20 text-2xl">Contrast</h1>

    <img class="m-20" src="monkey.jpg" />
    <img class="m-20 contrast-0" src="monkey.jpg" />
    <img class="m-20 contrast-50" src="monkey.jpg" />
    <img class="m-20 contrast-75" src="monkey.jpg" />
    <img class="m-20 contrast-125" src="monkey.jpg" />
    <img class="m-20 contrast-150" src="monkey.jpg" />

    <!-- Greyscale -->
    <h1 class="m-20 text-2xl">Greyscale</h1>
    <img class="m-20 grayscale-0" src="monkey.jpg" />
    <img class="m-20 grayscale" src="monkey.jpg" />

    <!-- Invert -->
    <h1 class="m-20 text-2xl">Invert</h1>
    <img class="m-20 invert-0" src="monkey.jpg" />
    <img class="m-20 invert" src="monkey.jpg" />

    <!-- Hue  -->
    <h1 class="m-20 text-2xl">Hue</h1>
    <img class="m-20 hue-rotate-0" src="monkey.jpg" />
    <img class="m-20 hue-rotate-30" src="monkey.jpg" />
    <img class="m-20 hue-rotate-60" src="monkey.jpg" />
    <img class="m-20 hue-rotate-90" src="monkey.jpg" />
    <img class="m-20 hue-rotate-180" src="monkey.jpg" />


  </body>
</html>
