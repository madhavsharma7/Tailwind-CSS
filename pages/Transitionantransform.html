<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition and Transform</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <img>
    <!-- Time duration for animation is called transition and tranform is to change the shape or position of an element  -->

    <button
      class="bg-blue-300 p-2 m-10 text-white rounded-lg hover:bg-blue-500"
    >
      Click Here
    </button>  

    <button
      class="bg-blue-300 p-2 m-10 text-white rounded-lg hover:bg-blue-500 transition duration-500"
    >
      Click Here
    </button>

    <button
      class="bg-red-300 p-2 m-10 text-white rounded-lg hover:bg-blue-500 transition duration-500 hover:opacity-20"
    >
      Click Here
    </button>

    <button
      class="bg-red-500 p-2 m-10 text-white rounded hover:rotate-180 transition-transform duration-1000"
    >
      Click Here
    </button>
    <!-- We can do both scale in x axis and y axis -->
    <button
      class="bg-red-500 p-2 m-10 text-white rounded transition-transform duration-1000 hover:scale-150"
    >
      Click Here
    </button>
<!-- On hover small -->
    <button
      class="bg-red-500 p-2 m-10 text-white rounded transition-transform duration-1000 hover:scale-50"
    >
      Click Here
    </button>

    <img src="./monkey.jpg" class="w-40 h-40 ml-[30vw] hover:rotate-45 hover:scale-125 hover:transition-transform duration-1000" > </img>

  </body>
</html>
