<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactivity</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- Interactivity -->
    <button class="bg-blue-500 rounded-md p-4 m-5 text-white">Login</button>
    <button
      class="bg-blue-500 rounded-md p-4 m-5 text-white hover:bg-blue-200 hover:p-10"
    >
      Login
    </button>
    <button
      class="bg-blue-500 rounded-md p-4 m-5 text-white focus:bg-amber-300"
    >
      Login
    </button>
    <button
      class="bg-blue-500 rounded-md p-4 m-5 text-white active:bg-amber-700"
    >
      Login
    </button>

    <button
      class="bg-blue-500 rounded-md p-4 m-5 text-white hover:bg-blue-200 focus:bg-amber-300 active:bg-amber-700"
    >
      Login
    </button>

    <!-- <div><h1 class="hover:text-blue-600 hover:bg-black">Click Here</h1></div>
    <div><h1 class="hover:text-white group-hover:bg-black">Click Here</h1></div>
 -->

    <div>
      <a class="group">
        <h1 class="group-hover:bg-black group-hover:text-amber-100">
          Click Here
        </h1>
        <p class="group-hover:bg-black group-hover:text-amber-50">
          Click Here two times
        </p>
      </a>
    </div>
  </body>
</html>
