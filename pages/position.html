<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positions</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>

    <div class="size-96 bg-emerald-300 relative">
      <div class="size-14 bg-amber-900 absolute bottom-0 right-0"></div>
      <div class="size-14 bg-amber-300 absolute top-0 right-0"></div>
      <div class="size-14 bg-amber-400 absolute top-0 laft-0"></div>
      <div class="size-14 bg-amber-600 absolute bottom-0 left-0"></div>
    </div>

    <div class="size-96 bg-pink-400">
        <h1 class="bg-pink-600 fixed z-20">Code step by step</h1>
    </div>
    <div class="bg-cyan-600 size-96 relative">
      <div class="bg-cyan-800 size-32 inset-32 absolute"></div>
    </div>
  </body>
</html>
